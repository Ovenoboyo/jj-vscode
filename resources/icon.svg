<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Connecting VCS Branch Line -->
  <path d="M 200 170 Q 256 220 312 170" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 20" />

  <!-- First 'j' -->
  <g filter="url(#glow)">
    <!-- Stem & Hook -->
    <path d="M 216 170 L 216 320 A 46 46 0 0 1 124 320 A 18 18 0 0 1 160 320 A 10 10 0 0 0 180 320 L 180 170 A 18 18 0 0 1 216 170 Z"
          fill="url(#primaryGrad)" />
    <!-- Node Dot -->
    <circle cx="198" cy="116" r="26" fill="#38bdf8" />
  </g>

  <!-- Second 'j' -->
  <g filter="url(#glow)">
    <!-- Stem & Hook -->
    <path d="M 336 170 L 336 360 A 64 64 0 0 1 208 360 A 18 18 0 0 1 244 360 A 28 28 0 0 0 300 360 L 300 170 A 18 18 0 0 1 336 170 Z"
          fill="url(#secondaryGrad)" />
    <!-- Node Dot -->
    <circle cx="318" cy="116" r="26" fill="#c084fc" />
  </g>

  <!-- Branch connector dots/nodes -->
  <circle cx="198" cy="116" r="12" fill="#0f172a" />
  <circle cx="318" cy="116" r="12" fill="#0f172a" />
</svg>
